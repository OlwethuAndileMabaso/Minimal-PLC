<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Minimal-PLC{% endblock %}</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #1a1a2e; color: #e0e0e0; }
        nav { background: #16213e; padding: 0 1.5rem; display: flex;
              align-items: center; height: 56px; border-bottom: 1px solid #0f3460; }
        nav .brand { font-size: 1.1rem; font-weight: 700; color: #e94560;
                     text-decoration: none; margin-right: 2rem; }
        nav a { color: #a0a0b0; text-decoration: none; padding: 0.4rem 0.8rem;
                border-radius: 4px; font-size: 0.9rem; }
        nav a:hover, nav a.active { background: #0f3460; color: #e0e0e0; }
        main { padding: 2rem; max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #e0e0e0; }
        .card { background: #16213e; border: 1px solid #0f3460; border-radius: 8px;
                padding: 1.5rem; margin-bottom: 1.5rem; }
        .card h2 { font-size: 1rem; margin-bottom: 1rem; color: #a0a0b0;
                   text-transform: uppercase; letter-spacing: 0.05em; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 0.6rem 0.8rem;
                 border-bottom: 1px solid #0f3460; font-size: 0.9rem; }
        th { color: #a0a0b0; font-weight: 600; }
        .badge { display: inline-block; padding: 0.2rem 0.6rem; border-radius: 12px;
                 font-size: 0.75rem; font-weight: 600; }
        .badge-green { background: #1a3a1a; color: #4caf50; }
        .badge-red   { background: #3a1a1a; color: #f44336; }
        .badge-grey  { background: #2a2a3a; color: #9e9e9e; }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <nav>
        <a class="brand" href="/dashboard">⚙ Minimal-PLC</a>
        <a href="/dashboard" {% if active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
        <a href="/hmi"       {% if active == 'hmi'       %}class="active"{% endif %}>HMI</a>
        <a href="/bacnet"    {% if active == 'bacnet'    %}class="active"{% endif %}>BACnet</a>
        <a href="/network"   {% if active == 'network'   %}class="active"{% endif %}>Network</a>
        <a href="/settings"  {% if active == 'settings'  %}class="active"{% endif %}>Settings</a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    {% block scripts %}{% endblock %}
</body>
</html>
